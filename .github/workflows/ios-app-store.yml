name: iOS App Store

on:
  workflow_dispatch:
  workflow_call:
    secrets:
      IOS_DISTRIBUTION_P12_BASE64:
        required: true
      IOS_DISTRIBUTION_P12_PASSWORD:
        required: true
      IOS_APP_STORE_PROFILE_BASE64:
        required: true
      APP_STORE_CONNECT_KEY_ID:
        required: true
      APP_STORE_CONNECT_ISSUER_ID:
        required: true
      APP_STORE_CONNECT_KEY_P8_BASE64:
        required: true

permissions:
  contents: read

# Serialize uploads; never cancel an in-flight upload when another release starts.
concurrency:
  group: ios-app-store
  cancel-in-progress: false

jobs:
  verify:
    # release.yml has already verified this exact commit before calling us.
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/verify.yml

  upload:
    needs: verify
    if: ${{ !cancelled() && !failure() }}
    runs-on: macos-26
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.4.1.app/Contents/Developer
    defaults:
      run:
        shell: bash
    steps:
      - name: Set temporary signing paths
        run: |
          echo "SIGNING_DIR=$RUNNER_TEMP/sillydraft-ios-signing" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PATH=$RUNNER_TEMP/sillydraft-ios.keychain-db" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - name: Check toolchain and signing validator
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          python3 -m unittest discover -s tool -p test_ios_signing.py -v
      - run: flutter pub get --enforce-lockfile

      - name: Import and validate signing credentials
        id: signing
        env:
          IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          IOS_APP_STORE_PROFILE_BASE64: ${{ secrets.IOS_APP_STORE_PROFILE_BASE64 }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_P8_BASE64: ${{ secrets.APP_STORE_CONNECT_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          for name in IOS_DISTRIBUTION_P12_BASE64 IOS_DISTRIBUTION_P12_PASSWORD IOS_APP_STORE_PROFILE_BASE64 APP_STORE_CONNECT_KEY_ID APP_STORE_CONNECT_ISSUER_ID APP_STORE_CONNECT_KEY_P8_BASE64; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing secret: $name (see docs/ios-app-store.md)"
              exit 1
            fi
          done
          [[ "$APP_STORE_CONNECT_KEY_ID" =~ ^[A-Z0-9]{10}$ ]]
          [[ "$APP_STORE_CONNECT_ISSUER_ID" =~ ^[0-9a-fA-F-]{36}$ ]]
          mkdir -p "$SIGNING_DIR/private_keys"
          printf '%s' "$IOS_DISTRIBUTION_P12_BASE64" | base64 --decode > "$SIGNING_DIR/distribution.p12"
          printf '%s' "$IOS_APP_STORE_PROFILE_BASE64" | base64 --decode > "$SIGNING_DIR/app.mobileprovision"
          printf '%s' "$APP_STORE_CONNECT_KEY_P8_BASE64" | base64 --decode > "$SIGNING_DIR/private_keys/AuthKey_$APP_STORE_CONNECT_KEY_ID.p8"
          openssl pkey -in "$SIGNING_DIR/private_keys/AuthKey_$APP_STORE_CONNECT_KEY_ID.p8" -noout
          keychain_password=$(openssl rand -hex 32)
          echo "::add-mask::$keychain_password"
          security create-keychain -p "$keychain_password" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$keychain_password" "$KEYCHAIN_PATH"
          security import "$SIGNING_DIR/distribution.p12" -P "$IOS_DISTRIBUTION_P12_PASSWORD" -t cert -f pkcs12 -k "$KEYCHAIN_PATH" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -k "$keychain_password" "$KEYCHAIN_PATH" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security cms -D -i "$SIGNING_DIR/app.mobileprovision" > "$SIGNING_DIR/profile.plist"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH" > "$SIGNING_DIR/identities.txt"
          python3 tool/ios_signing.py "$SIGNING_DIR/profile.plist" "$SIGNING_DIR/identities.txt" "$SIGNING_DIR/ExportOptions.plist"
          uuid=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$SIGNING_DIR/profile.plist")
          mkdir -p "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          cp "$SIGNING_DIR/app.mobileprovision" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/$uuid.mobileprovision"

      - name: Archive and export App Store IPA
        env:
          TEAM_ID: ${{ steps.signing.outputs.team_id }}
          PROFILE_UUID: ${{ steps.signing.outputs.profile_uuid }}
          CERTIFICATE_SHA1: ${{ steps.signing.outputs.certificate_sha1 }}
        run: |
          set -euo pipefail
          # Keep pubspec.yaml as the version/build-number source of truth.
          flutter build ios --release --config-only --no-codesign
          # Only Runner uses this xcconfig. Global signing overrides also reach
          # SwiftPM resource bundles, which cannot use provisioning profiles.
          printf '\nCODE_SIGN_STYLE = Manual\nDEVELOPMENT_TEAM = %s\nCODE_SIGN_IDENTITY = %s\nPROVISIONING_PROFILE_SPECIFIER = %s\n' \
            "$TEAM_ID" "$CERTIFICATE_SHA1" "$PROFILE_UUID" >> ios/Flutter/Release.xcconfig
          xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$PWD/build/ios/archive/Runner.xcarchive" \
            archive
          xcodebuild -exportArchive \
            -archivePath "$PWD/build/ios/archive/Runner.xcarchive" \
            -exportOptionsPlist "$SIGNING_DIR/ExportOptions.plist" \
            -exportPath "$PWD/build/ios/ipa"
          mkdir -p dist
          ditto -c -k --keepParent build/ios/archive/Runner.xcarchive dist/Runner.xcarchive.zip
          cp build/ios/ipa/*.ipa dist/

      - name: Preserve IPA and archive with dSYMs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ios-app-store-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

      - name: Validate and upload to App Store Connect
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail
          export API_PRIVATE_KEYS_DIR="$SIGNING_DIR/private_keys"
          shopt -s nullglob
          packages=(build/ios/ipa/*.ipa)
          if [ "${#packages[@]}" -ne 1 ]; then
            echo '::error::Expected exactly one IPA'
            exit 1
          fi
          xcrun altool --validate-app "${packages[0]}" \
            --api-key "$APP_STORE_CONNECT_KEY_ID" --api-issuer "$APP_STORE_CONNECT_ISSUER_ID"
          xcrun altool --upload-app -f "${packages[0]}" \
            --api-key "$APP_STORE_CONNECT_KEY_ID" --api-issuer "$APP_STORE_CONNECT_ISSUER_ID"
          echo '构建已上传 App Store Connect；等待 Apple 处理后可用于 TestFlight 或手动正式提审。' >> "$GITHUB_STEP_SUMMARY"

      - name: Remove signing credentials
        if: always()
        run: |
          security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true
          if [ -f "$SIGNING_DIR/profile.plist" ]; then
            uuid=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$SIGNING_DIR/profile.plist" 2>/dev/null || true)
            if [[ "$uuid" =~ ^[0-9a-fA-F-]{36}$ ]]; then
              rm -f "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/$uuid.mobileprovision"
            fi
          fi
          rm -rf "$SIGNING_DIR"
