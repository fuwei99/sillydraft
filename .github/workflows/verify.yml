name: Verify

on:
  # Tags run this through release.yml instead.
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # A release commit is verified by release.yml on its tag; skip the branch push.
    if: github.event_name != 'push' || github.ref_type == 'tag' || !startsWith(github.event.head_commit.message, 'chore(release):')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: python3 -m unittest discover -s tool -p test_ios_signing.py -v
      - run: dart pub get --enforce-lockfile
        working-directory: packages/sillydraft_core
      - run: dart pub get --enforce-lockfile
        working-directory: server
      - run: dart format --output=none --set-exit-if-changed lib test integration_test test_driver tool packages/sillydraft_core/lib packages/sillydraft_core/test server/lib server/bin server/test
      - run: flutter analyze
      - run: dart test --reporter expanded
        working-directory: packages/sillydraft_core
      - run: dart pub get --enforce-lockfile
        working-directory: packages/sillydraft_workspace
      - run: dart format --output=none --set-exit-if-changed lib test bin
        working-directory: packages/sillydraft_workspace
      - run: dart analyze
        working-directory: packages/sillydraft_workspace
      - run: dart test --reporter expanded
        working-directory: packages/sillydraft_workspace
      - run: flutter test test --reporter expanded
      - run: dart test --reporter expanded
        working-directory: server

